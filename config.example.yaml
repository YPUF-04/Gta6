# ============================================================
#  GTA 6 KLIPÇİ — AYARLAR
#  KURULUM.bat bu dosyayı config.yaml olarak kopyalar.
#  Sen sadece config.yaml'ı düzenle.
# ============================================================

# ---------- TELEGRAM (zorunlu) ----------
# 1) Telegram'da @BotFather'a yaz -> /newbot -> sana bir token verir, buraya yapıştır.
# 2) Programı başlat, botuna /start yaz. Bot seni otomatik tanır (chat_id'yi kendisi kaydeder).
telegram:
  bot_token: ""
  paylasim_bot_token: ""   # (isteğe bağlı) 2. bot = paylaşım kanalı. Telegram'dan /ikinci_bot ile de kurulur
  chat_id: ""          # boş bırak, /start yazınca otomatik dolar

# ---------- YAPAY ZEKA (önerilir) ----------
# Türkçe başlık, açıklama, hashtag ve altyazı çevirisi için.
# https://console.anthropic.com adresinden API anahtarı al.
# Boş bırakırsan hazır şablon başlıklar kullanılır.
anthropic_api_key: ""
claude_model: "claude-opus-5-5"

# ---------- OYUN ----------
# İleride başka oyuna geçmek için sadece burayı değiştir (örnek: ad: "Minecraft", kisa: "Minecraft", etiket: "#minecraft")
oyun:
  ad: "Grand Theft Auto VI"   # Twitch/Kick'teki kategori adı
  kisa: "GTA 6"               # yazılarda geçen ad
  etiket: "#gta6"

# ---------- HANGİ YAYINLAR İZLENSİN ----------
# Program Twitch, Kick ve YouTube'da şu an GTA 6 oynayan yayınları KENDİSİ bulur.
# İsim yazmana gerek yok. Anahtarlar isteğe bağlı (anahtarsız da çalışır).
otomatik_bul:
  acik: true
  twitch: true
  kick: true
  youtube: true
  oyun_adi: "Grand Theft Auto VI"
  youtube_arama: "GTA 6"
  en_az_izleyici: 300       # bundan az izleyicisi olan yayınlara bakma (chat'i az olur)
  dil: ""                   # "en", "tr" ... boş = hepsi
  # İsteğe bağlı resmi anahtarlar (daha sağlam). Boş bırakabilirsin.
  twitch_client_id: ""      # https://dev.twitch.tv/console
  twitch_client_secret: ""
  kick_client_id: ""        # https://kick.com/settings/developer
  kick_client_secret: ""

kanallar:
  # Kesin izlenmesini istediğin yayıncılar (isteğe bağlı). Açıldıkları an listeye girerler.
  twitch:
    - kaicenat
    - xqc
  kick:
    - adinross
  youtube: []               # örn: ["@IShowSpeed"]

  # Kara liste — bunları asla klipleme
  yasakli: []

# Aynı anda kaç yayın izlensin. Hepsi paralel izlenir, hangisinde chat patlarsa ondan klip çıkar.
# Her yayın ~2.5-5 Mbps internet ve biraz RAM yer. Fazlası kayıtları bozar; 10-15 genelde en iyisi.
ayni_anda_en_fazla_kanal: 12    # ÜST sınır. Telegram'dan /sinir 12 ile de değişir
# Program bu kadarla BAŞLAR; kayıtlar akıcıysa birkaç dakikada bir 2 artırır, takılırsa azaltır
baslangic_yayin_sayisi: 6

# Türkçe hesap için malzeme: en az bu kadar Türkçe yayın izlensin (küçük de olsa)
dil_kotasi:
  tr: 8

# Sadece bu dillerdeki yayınlar alınır (boş bırakırsan açık hesapların dilleri: tr, en)
# İspanyolca/Arapça vb. de istersen: izin_verilen_diller: [tr, en, es, ar]  (çeviri için Claude anahtarı lazım)
izin_verilen_diller: []

# Türkçe yayın -> Türkçe hesap, İngilizce yayın -> İngilizce hesap (diğer diller -> İngilizce)
dil_yonlendirme: true

# Türkçe yayıncı -> Türkçe altyazı (TR hesabı). Diğer her yayıncı -> İngilizce altyazı (EN hesabı);
# İngilizce konuşmuyorsa (Almanca, İspanyolca...) konuşması İngilizceye çevrilir.
# false yaparsan bu yayınlar hiç alınmaz.
yabanci_dil_cevir: true
atlanan_diller: [ar]        # bu dillerdeki yayınlar hiç izlenmez (ar = Arapça)

# Günde yaklaşık kaç klip çıksın (eşik buna göre kendiliğinden ayarlanır)
hedef_gunluk_klip: 60

# Aynı anda kaç klip kurgulansın (2 yeter; güçlü bilgisayar = 3-4)
ayni_anda_kurgu: 2

# ---------- KLİP ALGILAMA ----------
algilama:
  pencere_sn: 10            # chat bu kadar saniyelik pencerede sayılır (videodaki gibi 10 sn)
  kat: 3.0                  # normal chat hızının kaç katı olursa "patlama" sayılır
  en_az_mesaj: 25           # küçük yayınlarda saçma klip çıkmasın diye alt sınır
  bekleme_sn: 120           # aynı kanaldan iki klip arası en az bu kadar süre
  isinma_sn: 90             # yayına girince önce chat'in normal hızını öğren

klip:
  # Sabit süre yok: klip olayın biraz öncesinden başlar, chat coştuğu sürece devam eder, sakinleşince biter.
  once_sn: 18               # patlamadan kaç saniye önce başlasın (chat geç tepki verir)
  sonra_sn: 8               # chat sakinleştikten sonra kaç saniye tepki payı
  en_uzun_sn: 90            # en fazla bu kadar uzar
  tampon_sn: 240            # bilgisayarda her yayının son kaç saniyesi tutulsun
  kalite: "720p,720p60,best"   # (değiştirmek için kalite_zorla: true da ekle)
  zoom: 1.3                 # oyun görüntüsünü ortadan ne kadar yakınlaştır (1.0 = hiç)

# ---------- CHAT EKRANDA ----------
# Chat'te yazılanlar (LMAO, NO WAY, CLIP THAT...) kısa süreliğine videonun üstüne düşer
chat_ekrani:
  acik: true
  en_fazla_mesaj: 5         # bir klipte en fazla kaç chat mesajı görünsün (sadece patlama anında)
  sure_sn: 1.8              # her mesaj kaç saniye görünsün

# ---------- ALTYAZI ----------
altyazi:
  acik: true
  whisper_model: "auto"     # auto = ekran kartı varsa büyük model (çok doğru), yoksa small
  cihaz: "auto"             # auto / cpu / cuda (NVIDIA ekran kartın varsa cuda çok hızlı)

# ---------- HESAPLAR ----------
# Her açık hesap için ayrı dilde video + Instagram/TikTok/YouTube açıklaması üretilir.
# Telegram'dan /hesap ile aç-kapat, /isim @kullaniciadi ile videonun altındaki ismi değiştir.
# OTOMATİK PAYLAŞIM (ücretsiz): instagram_token girersen o hesaba Reels kendiliğinden paylaşılır.
# YouTube: youtube/client_secret.json koy + YOUTUBE_BAGLA.bat. Kurulum adımları README'de.
hesaplar:
  - ad: "TR"
    dil: "tr"
    instagram_token: ""
  - ad: "EN"
    dil: "en"
    instagram_token: ""

youtube_gunluk: 6           # hesap başına günde en fazla kaç YouTube yüklemesi (Google'ın ücretsiz sınırı ~6)

# ---------- YÜZ KAMERASI ----------
# Yayıncının kamerası bulunursa: üstte yüzü, altta oyun (en çok izlenen klip düzeni)
yuz_kamerasi: true
yuz_icin_en_az_izleyici: 2000   # bundan küçük (otomatik bulunan) yayıncıların yüzü kullanılmaz, sadece oyun + ses

# ---------- KURGU ----------
# Yüz bulunursa: üstte yayıncının yüzü, altta oyun, konuşma ortada kelime kelime (söylenen kelime mor kutuda).
# Yüz yoksa: "tweet" = beyaz zemin, üstte sayfa profili + büyük başlık, ortada kare video
#            "tek"   = ortada oyun, arkası bulanık
# Tweet tarzının adı/başlığı/fotoğrafı Telegram'dan: /ad, /ustyazi, fotoğraf + "/profil"
yuzlu_duzen: "pip"          # pip = oyun tam ekran, kamera sol üstte kutu · yuz = üstte kamera, altta oyun
yuzsuz_duzen: "tweet"
yakinlasma: true            # chat'in patladığı an ani yakınlaşma (editörlerin yaptığı gibi)
ilerleme_cubugu: false      # altta sarı ilerleme çubuğu

# ---------- PUAN / PAYLAŞIM PLANI ----------
hedef_puan: 7               # sadece 0-10 arası bu puan ve üstü anlar video olur (Telegram: /kalite 8)
ses_tetik: true             # chat'e bakmadan da: yayıncı aniden bağırırsa an incelenir
en_dusuk_puan: 0            # bunun altındaki klipler Telegram'a gelmez (0 = hepsi gelir)
paylasim_araligi_saat: 3    # kaç saatte bir paylaşılsın (Telegram: /aralik 3). 0 = gunluk_paylasim kullanılır
gunluk_paylasim: 25         # her hesap için günde kaç video (TR 25 + EN 25). Telegram: /gunluk 25
hedef_stok: 20              # her hesapta hazır bekleyen video hedefi
gunluk_meme: 2              # her hesap için günde kaç meme videosu (her gün 10:00'da hazırlanır)
stok_rapor_saati: "21:30"   # her akşam bu saatte yarının stok durumu gelir

# Telegram'a kendiliğinden bilgi mesajı (açıldı, klip hazırlanıyor, stok raporu) gelsin mi?
# false = sadece videolar + senin komutlarının cevapları. Telegram: /bildirim ac
bildirimler: false

# Klipler buraya kaydedilir
klasor: "klipler"
